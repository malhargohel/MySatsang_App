<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghar Sabha</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
        /* --- THEME COLORS --- */
        :root {
            /* Default to Dark Mode */
            --bg-color: #121212;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --card-bg: #1e1e1e;
            --card-border: 1px solid #333;
            --accent-color: #FF6B6B;
            --logo-bg: #ffffff; /* Keep white bg for transparent images */
            --shadow: none;
        }

        /* Auto-switch to Light Mode based on device settings */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #F2F2F7;
                --text-color: #000000;
                --text-secondary: #666666;
                --card-bg: #ffffff;
                --card-border: none;
                --logo-bg: #f0f0f0;
                --shadow: 0 4px 12px rgba(0,0,0,0.08);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            height: 100%;
        }

        /* Header */
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 15px 20px; 
            background-color: var(--bg-color);
            z-index: 10;
        }
        
        .header h1 { 
            font-size: 20px; 
            font-weight: 700; 
            text-align: center;
            flex: 1;
        }

        .icon-btn { 
            background: none; 
            border: none; 
            color: var(--text-color); 
            font-size: 24px; 
            cursor: pointer; 
            padding: 5px;
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .header-spacer { width: 40px; }

        /* Month Display */
        .month-display { 
            padding: 10px 20px 25px; 
            display: flex;
            flex-direction: column;
        }
        .month-text { 
            font-size: 28px; 
            font-weight: 700; 
            color: var(--text-color);
            letter-spacing: -0.5px;
        }
        .sub-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Scrollable List Area */
        .list-container { 
            flex: 1; 
            padding: 0 20px 40px; 
            overflow-y: auto; 
        }

        /* Card Styles */
        .card { 
            display: flex; 
            align-items: center; 
            margin-bottom: 20px; 
            background-color: var(--card-bg);
            border: var(--card-border);
            padding: 16px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
        }

        .card:active { transform: scale(0.98); }

        /* Container for the image */
        .logo-box {
            width: 50px; height: 50px; 
            background-color: var(--logo-bg); 
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center; 
            flex-shrink: 0; 
            position: relative;
            overflow: hidden; /* Ensures image stays within rounded corners */
        }

        /* Style for the image itself */
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Makes sure image fills the box perfectly */
        }
        
        .card-content { 
            margin-left: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            flex: 1;
        }
        
        .card-title { 
            font-size: 17px; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: var(--text-color); 
        }
        
        .link-btn {
            display: flex; 
            align-items: center; 
            text-decoration: none;
            color: var(--accent-color); 
            font-size: 14px; 
            font-weight: 600; 
            width: fit-content;
        }
        .link-btn ion-icon { margin-right: 4px; font-size: 16px; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <button class="icon-btn"><ion-icon name="arrow-back-outline"></ion-icon></button>
            <h1>Ghar Sabha</h1>
            <div class="header-spacer"></div>
        </header>

        <div class="month-display">
            <span id="current-month-text" class="month-text">Loading...</span>
            <span class="sub-text">Weekly Schedule</span>
        </div>

        <div class="list-container">

            <div class="card">
                <div class="logo-box">
                    <img src="photo_2025-12-21_23-12-13.jpg" alt="Week 1 Image">
                </div>
                <div class="card-content">
                    <div class="card-title">Week 1</div>
                    <a href="https://www.dropbox.com/scl/fo/d48xej7z3qm040ijw5swf/AJVwyEB4ZJi7MNt-LmTzJ10?rlkey=qkglfvlepuwxu61p7tsyowit6&st=wwpu7kv4&dl=0" target="_blank" class="link-btn">
                        <ion-icon name="document-text-outline"></ion-icon> View Material
                    </a>
                </div>
                <ion-icon name="chevron-forward" style="color: var(--text-secondary);"></ion-icon>
            </div>

            <div class="card">
                <div class="logo-box">
                    <img src="photo_2025-12-21_23-12-13.jpg" alt="Week 2 Image">
                </div>
                <div class="card-content">
                    <div class="card-title">Week 2</div>
                    <a href="https://www.dropbox.com/scl/fo/d48xej7z3qm040ijw5swf/AJVwyEB4ZJi7MNt-LmTzJ10?rlkey=qkglfvlepuwxu61p7tsyowit6&st=wwpu7kv4&dl=0" target="_blank" class="link-btn">
                        <ion-icon name="document-text-outline"></ion-icon> View Material
                    </a>
                </div>
                <ion-icon name="chevron-forward" style="color: var(--text-secondary);"></ion-icon>
            </div>

            <div class="card">
                <div class="logo-box">
                     <img src="photo_2025-12-21_23-12-13.jpg" alt="Week 3 Image">
                </div>
                <div class="card-content">
                    <div class="card-title">Week 3</div>
                    <a href="https://www.dropbox.com/scl/fo/d48xej7z3qm040ijw5swf/AJVwyEB4ZJi7MNt-LmTzJ10?rlkey=qkglfvlepuwxu61p7tsyowit6&st=wwpu7kv4&dl=0" target="_blank" class="link-btn">
                        <ion-icon name="document-text-outline"></ion-icon> View Material
                    </a>
                </div>
                <ion-icon name="chevron-forward" style="color: var(--text-secondary);"></ion-icon>
            </div>

            <div class="card">
                <div class="logo-box">
                     <img src="photo_2025-12-21_23-12-13.jpg" alt="Week 4 Image">
                </div>
                <div class="card-content">
                    <div class="card-title">Week 4</div>
                    <a href="https://www.dropbox.com/scl/fo/d48xej7z3qm040ijw5swf/AJVwyEB4ZJi7MNt-LmTzJ10?rlkey=qkglfvlepuwxu61p7tsyowit6&st=wwpu7kv4&dl=0" target="_blank" class="link-btn">
                        <ion-icon name="document-text-outline"></ion-icon> View Material
                    </a>
                </div>
                <ion-icon name="chevron-forward" style="color: var(--text-secondary);"></ion-icon>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateElement = document.getElementById('current-month-text');
            const now = new Date();
            const formattedDate = now.toLocaleDateString('en-US', { 
                month: 'long', 
                year: 'numeric' 
            });
            dateElement.textContent = formattedDate;
        });
    </script>

</body>
</html>
