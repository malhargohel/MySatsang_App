<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghar Sabha</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #FF6B6B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            padding-top: 10px;
        }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .header h1 { font-size: 20px; font-weight: 700; }
        .icon-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* Month Selector */
        .month-selector { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 20px; }
        .month-display { display: flex; flex-direction: column; align-items: center; }
        .month-text { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
        .underline { width: 100%; height: 1px; background-color: rgba(255, 255, 255, 0.5); }
        .arrow-btn { color: #888; font-size: 24px; cursor: pointer; padding: 10px; user-select: none; }
        
        /* Disabled state for future months */
        .arrow-btn.disabled { opacity: 0.3; pointer-events: none; }

        /* Content List */
        .list-container { flex: 1; padding: 0 20px; overflow-y: auto; }

        /* Month Groups (Hidden by default) */
        .month-group { display: none; animation: fadeIn 0.3s ease; }
        .month-group.active { display: block; }

        /* Card Styles */
        .card { display: flex; align-items: center; margin-bottom: 25px; }
        .logo-box {
            width: 70px; height: 70px; background-color: white; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0; position: relative;
        }
        .logo-img { width: 40px; height: 40px; object-fit: contain; }
        .logo-text-overlay { position: absolute; bottom: 5px; text-align: center; line-height: 0.9; }
        .logo-text-overlay div:first-child { font-size: 9px; font-weight: 900; color: black; }
        .logo-text-overlay div:last-child { font-size: 7px; font-weight: 700; color: black; }

        .card-content { margin-left: 16px; display: flex; flex-direction: column; justify-content: center; }
        .card-title { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: white; text-decoration: none; }
        
        /* The Link Button */
        .link-btn {
            display: flex; align-items: center; text-decoration: none;
            color: var(--accent-color); font-size: 15px; font-weight: 500; width: fit-content;
        }
        .link-btn ion-icon { margin-right: 5px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

        <div class="month-selector">

                <div class="underline"></div>
            </div>
            <div class="arrow-btn" id="next-btn" onclick="changeMonth(1)"><ion-icon name="chevron-forward-outline"></ion-icon></div>
        </div>

        <div id="content-wrapper" class="list-container">

            <div id="2025-11" class="month-group">

                    <div class="card-content">
                        <div class="card-title">Families of Adults (English)</div>

                <div class="card">

                    </div>
                    <div class="card-content">
                        <div class="card-title">Families of Adults (Gujarati)</div>
                        <a href="https://t.me/c/2992101464/53" target="_blank" class="link-btn">
                            <ion-icon name="open-outline"></ion-icon> Open

                    </div>
                </div>

            </div>
            <div id="2025-10" class="month-group"> 
                
                <div class="card">

                        <img src="https://i.imgur.com/Q6XzY8N.png" class="logo-img">
                        <div class="logo-text-overlay"><div>ghar</div><div>sabha</div></div>

                    <div class="card-content">

            </div>
            </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC (ONLY HANDLES VISIBILITY) ---
        
        // 1. Current State
        const maxDate = new Date(); // Locks future months based on today's real date
        
        // Start at December 2025 (Year 2025, Month 11)
        let currentDate = new Date(2025, 11, 1); 

        // 2. Render Function (Shows/Hides HTML Blocks)
        function render() {
            // Update Text
            const dateString = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            document.getElementById('current-date-text').textContent = dateString;

            // Generate ID string (e.g., "2025-11")
            const currentId = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;

            // Hide all month groups
            const allGroups = document.querySelectorAll('.month-group');
            allGroups.forEach(group => group.classList.remove('active'));

            // Show the specific month group if it exists
            const activeGroup = document.getElementById(currentId);
            if (activeGroup) {
                activeGroup.classList.add('active');
            } else {
                // If you scroll to a month where you haven't made HTML yet, nothing shows.
            }

            // Update Arrows (Disable next if future)
            const nextBtn = document.getElementById('next-btn');
            const nextMonthCheck = new Date(currentDate);
            nextMonthCheck.setMonth(currentDate.getMonth() + 1);

            if (nextMonthCheck > maxDate) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }
        }

        // 3. Change Month Handler
        function changeMonth(offset) {
            const newDate = new Date(currentDate);
            newDate.setMonth(newDate.getMonth() + offset);

            if (offset > 0 && newDate > maxDate) return; 

            currentDate = newDate;
            render();
        }

        // Initial Run
        render();
    </script>
</body>
</html>
